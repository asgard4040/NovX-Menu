<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="أوردوفا يربط الزبون والويتر والمطبخ وإدارة المطعم عبر منيو QR ذكي وطلبات مباشرة من الطاولة." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ORDOVA" />
    <meta property="og:title" content="أوردوفا | نظام المنيو الذكي وإدارة المطاعم" />
    <meta property="og:description" content="من مسح QR إلى تقديم الطلب: تجربة متصلة للضيف وفريق المطعم." />
    <meta property="og:image" content="https://ordova.cc/marketing/ordova-qr-restaurant-hero-v2.jpg" />
    <link rel="canonical" href="https://ordova.cc" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"ORDOVA","applicationCategory":"BusinessApplication","operatingSystem":"Web browser","description":"A QR digital menu and connected restaurant ordering and management system for guests, waiters, kitchens, and managers."}</script>
    <link rel="icon" type="image/png" href="/ordova-mark.png" />
    <link rel="apple-touch-icon" href="/ordova-mark.png" />
    <meta name="theme-color" content="#081220" />
    <script>
      // Set the manifest before the page finishes loading. iOS saves its
      // start_url when adding this page to the Home Screen.
      (() => {
        const params = new URLSearchParams(location.search);
        const menuId = params.get('restaurantId');
        const staffId = params.get('loginRestaurantId');
        const requestedRole = params.get('portal');
        const role = requestedRole === 'waiter' || requestedRole === 'kitchen' ? requestedRole : 'restaurant';
        if (menuId || staffId || location.pathname.startsWith('/app')) {
          const link = document.createElement('link');
          link.rel = 'manifest';
          link.href = menuId
            ? '/api/home-screen-manifest?restaurantId=' + encodeURIComponent(menuId) + '&portal=menu'
            : staffId
              ? '/api/home-screen-manifest?restaurantId=' + encodeURIComponent(staffId) + '&portal=' + role
              : '/manifest.json';
          document.head.appendChild(link);
        }
      })();
    </script>
    <title>أوردوفا | نظام المنيو الذكي وإدارة المطاعم</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
